<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Your Profile - MSC</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/guard.js"></script>

  <style>
    body {
      background: linear-gradient(135deg, #050505 0%, #111 100%);
      color: white;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .onboarding-container {
      background: rgba(25, 25, 25, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    h2 {
      text-align: center;
      margin-bottom: 10px;
      font-weight: 700;
      background: linear-gradient(90deg, #0078d4, #00bcf2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
      font-size: 0.95rem;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #ddd;
      font-size: 0.9rem;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: white;
      font-size: 1rem;
      transition: border-color 0.3s;
      box-sizing: border-box;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #0078d4;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #0078d4;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, transform 0.1s;
      margin-top: 10px;
    }
    .btn-submit:hover {
      background: #005a9e;
    }
    .btn-submit:active {
      transform: scale(0.98);
    }
    .error-msg {
      color: #ff5555;
      text-align: center;
      margin-top: 15px;
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="onboarding-container">
    <h2>Welcome to MSC</h2>
    <p class="subtitle">Please complete your profile to continue.</p>

    <form id="onboardingForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="fullName" placeholder="e.g. Full Name" required>
      </div>
      
      <div class="form-group">
        <label>Registration Number</label>
        <input type="text" id="regNumber" placeholder="e.g. AP21110010001" required>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="phoneNumber" placeholder="e.g. 9876543210" required>
      </div>

      <div class="form-group">
        <label>Department</label>
        <select id="department" required>
          <option value="" disabled selected>Select your department...</option>
          <option value="CSE">Computer Science and Engineering</option>
          <option value="ECE">Electronics and Communication</option>
          <option value="MECH">Mechanical Engineering</option>
          <option value="BBA">Business Administration</option>
          <option value="OTHER">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Year of Study</label>
        <select id="yearOfStudy" required>
          <option value="" disabled selected>Select your year...</option>
          <option value="1">1st Year</option>
          <option value="2">2nd Year</option>
          <option value="3">3rd Year</option>
          <option value="4">4th Year</option>
        </select>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">Complete Profile</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>
  </div>

  <script src="js/onboarding.js"></script>
</body>
</html>
