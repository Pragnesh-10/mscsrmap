<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard - MSC</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/guard.js"></script>

  <style>
    body {
      background: linear-gradient(135deg, #050505 0%, #111 100%);
      color: white;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding-top: 80px;
    }
    .navbar {
      background: rgba(10, 10, 10, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
    }
    .nav-brand {
      font-size: 1.5rem;
      font-weight: 700;
      color: white;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-brand i { color: #0078d4; }
    .btn-logout {
      background: rgba(255, 85, 85, 0.1);
      color: #ff5555;
      border: 1px solid rgba(255, 85, 85, 0.3);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-logout:hover {
      background: #ff5555;
      color: white;
    }
    .dashboard-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .welcome-card {
      background: rgba(25, 25, 25, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 40px;
      margin-bottom: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .welcome-card h1 {
      margin-top: 0;
      font-weight: 700;
      background: linear-gradient(90deg, #0078d4, #00bcf2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .profile-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .detail-item {
      background: rgba(0, 0, 0, 0.4);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .detail-item label {
      display: block;
      color: #aaa;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }
    .detail-item p {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="#" class="nav-brand"><i class="fab fa-microsoft"></i> MSC Student Portal</a>
    <button class="btn-logout" id="btnLogout">Sign Out</button>
  </nav>

  <div class="dashboard-container">
    <div class="welcome-card">
      <h1>Welcome, <span id="userName">Student</span>!</h1>
      <p style="color: #aaa; font-size: 1.1rem;">This is your personal dashboard for the Microsoft Student Chapter at SRM AP.</p>
      
      <div class="profile-details">
        <div class="detail-item">
          <label>Registration Number</label>
          <p id="userRegNo">--</p>
        </div>
        <div class="detail-item">
          <label>Department</label>
          <p id="userDept">--</p>
        </div>
        <div class="detail-item">
          <label>Year of Study</label>
          <p id="userYear">--</p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/user-dashboard.js"></script>
</body>
</html>
